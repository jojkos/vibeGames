<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluff Helper v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .dice-btn-star, .dice-icon-star {
            color: #f59e0b; /* amber-500 */
        }
        .bid-value-btn.selected {
            background-color: #0ea5e9; /* sky-500 */
            color: white;
            border-color: #0284c7; /* sky-600 */
        }
        .bid-value-btn.selected svg {
             color: white;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-2xl mx-auto">
        
        <!-- Setup Screen -->
        <div id="setup-screen" class="bg-white p-8 rounded-xl shadow-lg">
            <h1 class="text-3xl font-bold text-center text-slate-900 mb-2">Bluff Helper</h1>
            <p class="text-center text-slate-600 mb-8">Nástroj pro statistickou podporu při hře Bluff.</p>
            <div class="space-y-4">
                <div>
                    <label for="player-count" class="block text-sm font-medium text-slate-700 mb-2">Počet hráčů (2-6):</label>
                    <input type="number" id="player-count" name="player-count" min="2" max="6" value="4" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition">
                </div>
                <button id="start-game-btn" class="w-full bg-sky-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-sky-700 active:bg-sky-800 transition-colors shadow-md">
                    Zahájit hru
                </button>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="hidden">
            <div class="bg-white p-6 md:p-8 rounded-xl shadow-lg mb-6">
                <div class="flex justify-between items-center mb-6">
                     <h2 class="text-2xl font-bold text-slate-900">Stav hry</h2>
                     <button id="reset-game-btn" class="text-sm bg-slate-200 text-slate-700 font-semibold py-2 px-4 rounded-lg hover:bg-slate-300 transition-colors">Nová hra</button>
                </div>
               
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <h3 class="font-semibold text-lg mb-3 text-slate-800">Kostky hráčů</h3>
                        <div id="players-container" class="space-y-3"></div>
                    </div>
                    <div class="bg-slate-50 border border-slate-200 rounded-lg p-4">
                        <h3 class="font-semibold text-lg mb-3 text-slate-800">Celkem ve hře</h3>
                        <div class="flex items-center justify-center bg-sky-100 text-sky-800 rounded-lg p-4">
                            <span id="total-dice-display" class="text-4xl font-bold">20</span>
                            <span class="ml-3 text-lg font-medium">kostek</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 md:p-8 rounded-xl shadow-lg">
                <h2 class="text-2xl font-bold text-slate-900 mb-4">Analýza tahu</h2>
                
                <div>
                    <h3 class="font-semibold text-lg mb-2 text-slate-800">1. Zadej své kostky</h3>
                    <div class="flex items-center justify-between bg-slate-50 p-3 rounded-lg border border-slate-200">
                        <div id="my-dice-display" class="flex-grow h-12 flex items-center space-x-2 text-2xl"></div>
                        <button id="clear-my-dice-btn" class="text-sm bg-slate-200 text-slate-700 font-semibold py-2 px-3 rounded-lg hover:bg-slate-300 transition-colors">Vyčistit</button>
                    </div>
                    <div class="grid grid-cols-6 gap-2 mt-3">
                        <button data-value="1" class="dice-btn text-2xl font-bold p-3 bg-white border-2 border-slate-300 rounded-lg hover:bg-slate-100 active:bg-slate-200 transition">1</button>
                        <button data-value="2" class="dice-btn text-2xl font-bold p-3 bg-white border-2 border-slate-300 rounded-lg hover:bg-slate-100 active:bg-slate-200 transition">2</button>
                        <button data-value="3" class="dice-btn text-2xl font-bold p-3 bg-white border-2 border-slate-300 rounded-lg hover:bg-slate-100 active:bg-slate-200 transition">3</button>
                        <button data-value="4" class="dice-btn text-2xl font-bold p-3 bg-white border-2 border-slate-300 rounded-lg hover:bg-slate-100 active:bg-slate-200 transition">4</button>
                        <button data-value="5" class="dice-btn text-2xl font-bold p-3 bg-white border-2 border-slate-300 rounded-lg hover:bg-slate-100 active:bg-slate-200 transition">5</button>
                        <button data-value="6" class="dice-btn dice-btn-star p-3 bg-white border-2 border-slate-300 rounded-lg hover:bg-slate-100 active:bg-slate-200 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mx-auto" fill="currentColor" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                        </button>
                    </div>
                </div>

                <div class="mt-6">
                     <h3 class="font-semibold text-lg mb-2 text-slate-800">2. Zobraz statistiku</h3>
                    <button id="calculate-btn" class="w-full bg-emerald-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-emerald-700 active:bg-emerald-800 transition-colors shadow-md">
                        Vypočítat doporučení
                    </button>
                </div>

                <!-- Results Section -->
                <div id="analysis-results" class="hidden mt-8 space-y-8">
                    <!-- Histogram -->
                    <div id="results-container">
                        <h3 class="font-semibold text-lg mb-4 text-slate-800">Očekávaný počet kostek na stole</h3>
                        <div id="histogram" class="space-y-3"></div>
                    </div>
                    <!-- Optimal Move -->
                    <div id="optimal-move-container">
                         <h3 class="font-semibold text-lg mb-3 text-slate-800">Doporučená sázka</h3>
                         <div id="optimal-move-display" class="text-center bg-sky-50 border border-sky-200 text-sky-900 font-semibold p-4 rounded-lg text-lg"></div>
                    </div>
                    <!-- Bid Verification -->
                    <div id="verify-bid-container" class="pt-8 border-t border-slate-200">
                        <h3 class="font-semibold text-lg mb-3 text-slate-800">Ověření sázky soupeře</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-start">
                            <div>
                                <label for="bid-quantity-input" class="block text-sm font-medium text-slate-700 mb-1">Počet kostek</label>
                                <input type="number" id="bid-quantity-input" min="1" value="3" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500">
                            </div>
                             <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Hodnota</label>
                                <div class="grid grid-cols-6 gap-1">
                                    <button data-value="1" class="bid-value-btn text-xl font-bold p-2 bg-white border-2 border-slate-300 rounded-lg hover:bg-slate-100 transition">1</button>
                                    <button data-value="2" class="bid-value-btn text-xl font-bold p-2 bg-white border-2 border-slate-300 rounded-lg hover:bg-slate-100 transition">2</button>
                                    <button data-value="3" class="bid-value-btn text-xl font-bold p-2 bg-white border-2 border-slate-300 rounded-lg hover:bg-slate-100 transition">3</button>
                                    <button data-value="4" class="bid-value-btn text-xl font-bold p-2 bg-white border-2 border-slate-300 rounded-lg hover:bg-slate-100 transition">4</button>
                                    <button data-value="5" class="bid-value-btn text-xl font-bold p-2 bg-white border-2 border-slate-300 rounded-lg hover:bg-slate-100 transition">5</button>
                                    <button data-value="6" class="bid-value-btn dice-btn-star p-2 bg-white border-2 border-slate-300 rounded-lg hover:bg-slate-100 transition">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mx-auto" fill="currentColor" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <button id="verify-bid-btn" class="mt-4 w-full bg-amber-500 text-white font-bold py-3 px-4 rounded-lg hover:bg-amber-600 active:bg-amber-700 transition-colors shadow-md">
                            Ověřit sázku
                        </button>
                        <div id="verify-result-display" class="mt-4 text-center p-4 rounded-lg text-lg font-bold hidden"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- DOM Elements ---
        const setupScreen = document.getElementById('setup-screen');
        const gameScreen = document.getElementById('game-screen');
        const playerCountInput = document.getElementById('player-count');
        const startGameBtn = document.getElementById('start-game-btn');
        const resetGameBtn = document.getElementById('reset-game-btn');
        const playersContainer = document.getElementById('players-container');
        const totalDiceDisplay = document.getElementById('total-dice-display');
        const myDiceDisplay = document.getElementById('my-dice-display');
        const clearMyDiceBtn = document.getElementById('clear-my-dice-btn');
        const diceBtns = document.querySelectorAll('.dice-btn');
        const calculateBtn = document.getElementById('calculate-btn');
        const analysisResults = document.getElementById('analysis-results');
        const histogram = document.getElementById('histogram');
        const optimalMoveDisplay = document.getElementById('optimal-move-display');
        const bidQuantityInput = document.getElementById('bid-quantity-input');
        const bidValueBtns = document.querySelectorAll('.bid-value-btn');
        const verifyBidBtn = document.getElementById('verify-bid-btn');
        const verifyResultDisplay = document.getElementById('verify-result-display');

        // --- Game State ---
        let players = [];
        let myDice = [];
        let selectedBidValue = null;
        const factorialCache = [1];

        // --- Event Listeners ---
        startGameBtn.addEventListener('click', startGame);
        resetGameBtn.addEventListener('click', resetGame);
        
        playersContainer.addEventListener('click', (e) => {
            const btn = e.target.closest('.decrease-dice-btn');
            if (btn) {
                const playerIndex = parseInt(btn.dataset.player, 10);
                decreasePlayerDice(playerIndex);
            }
        });

        diceBtns.forEach(btn => btn.addEventListener('click', () => addMyDie(parseInt(btn.dataset.value, 10))));
        clearMyDiceBtn.addEventListener('click', clearMyDice);
        calculateBtn.addEventListener('click', calculateAndShowStats);

        bidValueBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                selectedBidValue = parseInt(btn.dataset.value, 10);
                bidValueBtns.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
            });
        });
        verifyBidBtn.addEventListener('click', verifyBid);

        // --- Functions ---
        
        function getDiceIcon(value, classes = 'h-6 w-6') {
            if (value === 6) {
                return `<svg xmlns="http://www.w3.org/2000/svg" class="${classes} dice-icon-star" fill="currentColor" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`;
            }
            return value;
        }

        function resetGame() {
            gameScreen.classList.add('hidden');
            setupScreen.classList.remove('hidden');
            players = [];
            myDice = [];
            clearMyDice();
            analysisResults.classList.add('hidden');
            verifyResultDisplay.classList.add('hidden');
            selectedBidValue = null;
            bidValueBtns.forEach(b => b.classList.remove('selected'));
        }

        function startGame() {
            const playerCount = parseInt(playerCountInput.value, 10);
            if (playerCount < 2 || playerCount > 6) {
                alert('Zadejte prosím počet hráčů od 2 do 6.');
                return;
            }
            players = Array.from({ length: playerCount }, (_, i) => ({ id: i, dice: 5 }));
            setupScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            renderPlayers();
            updateTotalDice();
        }
        
        function renderPlayers() {
            playersContainer.innerHTML = '';
            players.forEach((player, index) => {
                const playerDiv = document.createElement('div');
                playerDiv.className = 'flex items-center justify-between bg-slate-50 p-3 rounded-lg border border-slate-200';
                playerDiv.innerHTML = `
                    <span class="font-medium text-slate-700">Hráč ${index + 1}</span>
                    <div class="flex items-center space-x-3">
                        <span class="font-bold text-lg text-slate-900">${player.dice}</span>
                        <button data-player="${index}" class="decrease-dice-btn bg-red-500 text-white w-7 h-7 rounded-full font-bold text-lg flex items-center justify-center hover:bg-red-600 transition-colors" ${player.dice === 0 ? 'disabled' : ''}>-</button>
                    </div>
                `;
                playersContainer.appendChild(playerDiv);
            });
        }

        function decreasePlayerDice(playerIndex) {
            if (players[playerIndex].dice > 0) {
                players[playerIndex].dice--;
                renderPlayers();
                updateTotalDice();
                analysisResults.classList.add('hidden'); // Hide old results
            }
        }
        
        function updateTotalDice() {
            const total = players.reduce((sum, player) => sum + player.dice, 0);
            totalDiceDisplay.textContent = total;
        }

        function addMyDie(value) {
            const myPlayerDiceCount = players[0]?.dice || 0;
            if (myDice.length >= myPlayerDiceCount) return;
            myDice.push(value);
            renderMyDice();
        }

        function renderMyDice() {
            myDiceDisplay.innerHTML = '';
            myDice.forEach(value => {
                const dieEl = document.createElement('span');
                dieEl.className = 'flex items-center justify-center w-10 h-10 bg-white border-2 border-slate-300 rounded-lg font-bold text-xl';
                dieEl.innerHTML = getDiceIcon(value);
                myDiceDisplay.appendChild(dieEl);
            });
        }

        function clearMyDice() {
            myDice = [];
            renderMyDice();
            analysisResults.classList.add('hidden'); // Hide old results
        }

        function calculateAndShowStats() {
            if (myDice.length === 0) {
                alert('Nejprve zadejte své kostky.');
                return;
            }
            const totalDice = parseInt(totalDiceDisplay.textContent, 10);
            const otherDiceCount = totalDice - myDice.length;
            
            if (otherDiceCount < 0) {
                alert('Chyba: Máte v ruce více kostek, než je celkem ve hře. Zkontrolujte počet kostek u hráčů.');
                return;
            }

            const stats = [];
            const starValue = 6;
            const PROB_SPECIFIC_NUM = 1/6;
            const PROB_STAR = 1/6;

            for (let i = 1; i <= 5; i++) {
                const countInHand = myDice.filter(d => d === i || d === starValue).length;
                const expectedFromOthers = otherDiceCount * (PROB_SPECIFIC_NUM + PROB_STAR);
                stats.push({ value: i, expected: countInHand + expectedFromOthers });
            }
            const starsInHandOnly = myDice.filter(d => d === starValue).length;
            const expectedStarsFromOthersOnly = otherDiceCount * PROB_STAR;
            stats.push({ value: starValue, expected: starsInHandOnly + expectedStarsFromOthersOnly });

            renderHistogram(stats);
            renderOptimalMove(stats);
            analysisResults.classList.remove('hidden');
            verifyResultDisplay.classList.add('hidden');
        }

        function renderHistogram(statsData) {
            histogram.innerHTML = '';
            const maxExpected = Math.max(...statsData.map(s => s.expected), 1);

            statsData.forEach(stat => {
                const barContainer = document.createElement('div');
                barContainer.className = 'flex items-center space-x-4';
                const label = document.createElement('div');
                label.className = 'w-10 h-10 flex-shrink-0 flex items-center justify-center text-xl font-bold border-2 border-slate-300 rounded-lg';
                label.innerHTML = getDiceIcon(stat.value, 'h-5 w-5');
                const barWrapper = document.createElement('div');
                barWrapper.className = 'flex-grow bg-slate-200 rounded-full h-8';
                const bar = document.createElement('div');
                bar.className = 'bg-sky-500 h-8 rounded-full flex items-center justify-end pr-3';
                bar.style.width = `${(stat.expected / maxExpected) * 100}%`;
                const valueText = document.createElement('span');
                valueText.className = 'text-white font-bold text-sm';
                valueText.textContent = stat.expected.toFixed(2);
                bar.appendChild(valueText);
                barWrapper.appendChild(bar);
                barContainer.appendChild(label);
                barContainer.appendChild(barWrapper);
                histogram.appendChild(barContainer);
            });
        }

        function renderOptimalMove(statsData) {
            const bestBet = statsData.reduce((best, current) => current.expected > best.expected ? current : best, { expected: -1 });
            optimalMoveDisplay.innerHTML = `Sázejte <strong class="text-2xl">${Math.floor(bestBet.expected)}x</strong> na hodnotu ${getDiceIcon(bestBet.value, 'inline-block h-7 w-7 align-middle')}`;
        }

        // --- Binomial Probability Functions ---
        function factorial(n) {
            if (n < 0) return NaN;
            if (n === 0) return 1;
            if (factorialCache[n]) return factorialCache[n];
            let result = factorialCache[factorialCache.length - 1];
            for (let i = factorialCache.length; i <= n; i++) {
                result *= i;
                factorialCache[i] = result;
            }
            return result;
        }

        function combinations(n, k) {
            if (k < 0 || k > n) return 0;
            if (k === 0 || k === n) return 1;
            if (k > n / 2) k = n - k;
            let res = 1;
            for (let i = 1; i <= k; i++) {
                res = res * (n - i + 1) / i;
            }
            return Math.round(res);
        }

        function binomialProbability(n, k, p) {
            return combinations(n, k) * Math.pow(p, k) * Math.pow(1 - p, n - k);
        }

        function verifyBid() {
            const bidQuantity = parseInt(bidQuantityInput.value, 10);
            if (!selectedBidValue || isNaN(bidQuantity) || bidQuantity < 1) {
                alert('Zadejte platnou sázku (počet a hodnotu).');
                return;
            }
            if (myDice.length === 0) {
                alert('Nejprve zadejte své kostky pro přesný výpočet.');
                return;
            }

            const totalDice = parseInt(totalDiceDisplay.textContent, 10);
            const otherDiceCount = totalDice - myDice.length;
            const starValue = 6;
            
            let countInHand;
            let probSingleDie;

            if (selectedBidValue === starValue) {
                countInHand = myDice.filter(d => d === starValue).length;
                probSingleDie = 1/6;
            } else {
                countInHand = myDice.filter(d => d === selectedBidValue || d === starValue).length;
                probSingleDie = 2/6;
            }

            const neededFromOthers = bidQuantity - countInHand;
            if (neededFromOthers <= 0) {
                renderVerifyResult(1); // 100% chance, I have them all
                return;
            }
            if (neededFromOthers > otherDiceCount) {
                renderVerifyResult(0); // 0% chance, not enough dice
                return;
            }

            let cumulativeProb = 0;
            for (let k = neededFromOthers; k <= otherDiceCount; k++) {
                cumulativeProb += binomialProbability(otherDiceCount, k, probSingleDie);
            }
            renderVerifyResult(cumulativeProb);
        }

        function renderVerifyResult(probability) {
            verifyResultDisplay.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
            const percentage = (probability * 100).toFixed(1);
            let recommendation;
            if (probability >= 0.5) {
                recommendation = 'VĚŘIT';
                verifyResultDisplay.classList.add('bg-green-100', 'text-green-800');
            } else {
                recommendation = 'NEVĚŘIT (BLUF)';
                verifyResultDisplay.classList.add('bg-red-100', 'text-red-800');
            }
            verifyResultDisplay.innerHTML = `${recommendation} <span class="block text-sm font-medium">(Šance ${percentage}%)</span>`;
        }
    });
    </script>
</body>
</html>
