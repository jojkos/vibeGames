<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Factorio Lamp Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>

    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #0d0e12;
        color: #d1d5db;
        min-height: 100vh;
        overflow-x: hidden;
        overscroll-behavior: none;
      }

      /* --- CUSTOM SCROLLBARS --- */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background-color: #4b5563;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-track {
        background-color: #1f2937;
      }

      .canvas-container {
        background-image: linear-gradient(45deg, #1f2937 25%, transparent 25%),
          linear-gradient(-45deg, #1f2937 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #1f2937 75%),
          linear-gradient(-45deg, transparent 75%, #1f2937 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        cursor: crosshair;
        touch-action: none;
      }

      /* Base styles for buttons that used to use @apply */
      .mode-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.75rem 1.5rem;
        border-radius: 0.75rem;
        border-width: 2px;
        font-weight: 700;
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        transition: all 0.2s;
      }

      .tool-btn {
        padding: 0.5rem;
        border-radius: 0.25rem;
        background-color: #374151; /* bg-gray-700 */
        color: #d1d5db; /* text-gray-300 */
        border: 1px solid #4b5563; /* border-gray-600 */
        transition: all 0.15s;
      }
      .tool-btn:hover {
        background-color: #4b5563; /* hover:bg-gray-600 */
      }
      .tool-btn.active {
        background-color: #d97706; /* bg-yellow-600 */
        color: white;
        border-color: #f59e0b; /* border-yellow-500 */
        transform: translateY(-2px);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }

      input[type="color"] {
        -webkit-appearance: none;
        border: none;
        padding: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
        background: none;
      }
      input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      input[type="color"]::-webkit-color-swatch {
        border: none;
        border-radius: 4px;
      }

      .coffee-link {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background-color: #FFDD00;
        color: #000;
        font-weight: 600;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        text-decoration: none;
        font-size: 0.875rem;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      }
      .coffee-link:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 8px rgba(0,0,0,0.25);
      }
    </style>

      function hexToRgb(hex) {
        const bigint = parseInt(hex.replace("#", ""), 16);
        return {
          r: (bigint >> 16) & 255,
          g: (bigint >> 8) & 255,
          b: bigint & 255,
        };
      }

      function encodeBlueprint(blueprintJson) {
        try {
          const jsonString = JSON.stringify(blueprintJson);
          const utf8Encoder = new TextEncoder();
          const jsonBytes = utf8Encoder.encode(jsonString);
          const compressed = pako.deflate(jsonBytes, { level: 9 });
          const binaryString = Array.from(compressed)
            .map((b) => String.fromCharCode(b))
            .join("");
          return "0" + btoa(binaryString);
        } catch (e) {
          console.error(e);
          return null;
        }
      }

      // --- GLOBAL APP STATE ---
      // Cleaned up: only draw mode exists now.

      // --- PART 1: SIMPLE TEXT GENERATOR ---
      function copyToClipboard(str, msgElement) {
        if (!str) return;
        const area = document.getElementById("clipboard-target");
        area.value = str;
        area.select();
        try {
          document.execCommand("copy");
          if (msgElement) {
            msgElement.textContent = "Blueprint Copied to Clipboard!";
            msgElement.className =
              "mt-4 text-center text-green-400 font-bold animate-pulse";
            setTimeout(() => {
              msgElement.textContent = "";
              msgElement.className = "";
            }, 3000);
          }
        } catch (e) {
          if (msgElement) {
            msgElement.textContent = "Error copying. Check console.";
            msgElement.className = "mt-4 text-center text-red-500";
          }
        }

      // --- PART 2: DRAWING STUDIO ---

      // Canvas State
      let GRID_W = 50;
      let GRID_H = 30;
      let PIXEL_SIZE = 15;
      let gridData = [];
      let drawHistory = []; // Renamed to avoid collision with global history
      let historyIndex = -1;
      let currentDrawTool = "brush"; // brush, fill, erase
      let isMouseDown = false;

      // Stamp State
      let stampScale = 1; // For Text: int. For Image: float multiplier.
      let stampMode = null; // null, 'text', 'image'
      let stampBuffer = null; // Current stamp pixels { w, h, data }
      let stampSourceImage = null; // ORIGINAL Image for high-quality resampling
      let stampBaseSize = { w: 0, h: 0 }; // Dimensions of image at 100% scale (or fit scale)
      
      let mouseX = 0;
      let mouseY = 0;

      // Panning State
      let isPanning = false;
      let panStart = { x: 0, y: 0 };
      let scrollStart = { x: 0, y: 0 };

      const canvas = document.getElementById("gridCanvas");
      const ctx = canvas.getContext("2d");

      function initDraw() {
        gridData = createEmptyGrid(GRID_W, GRID_H);
        saveState(); // Initial state
        renderCanvas();
      }

      function createEmptyGrid(w, h) {
        return new Array(h).fill(null).map(() => new Array(w).fill(null));
      }

      function resizeGrid() {
        const newW = parseInt(document.getElementById("grid-w").value) || 20;
        const newH = parseInt(document.getElementById("grid-h").value) || 20;

        // Resize grid preserving data
        const newGrid = createEmptyGrid(newW, newH);
        for (let y = 0; y < Math.min(GRID_H, newH); y++) {
          for (let x = 0; x < Math.min(GRID_W, newW); x++) {
            newGrid[y][x] = gridData[y][x];
          }
        }

        GRID_W = newW;
        GRID_H = newH;
        gridData = newGrid;

        // Reset History logic to avoid complexity with resizing
        drawHistory = [];
        historyIndex = -1;
        saveState();

        canvas.width = GRID_W * PIXEL_SIZE;
        canvas.height = GRID_H * PIXEL_SIZE;
        renderCanvas();
      }

      function clearCanvas() {
        gridData = createEmptyGrid(GRID_W, GRID_H);
        saveState();
        renderCanvas();
      }

      // History System
      function saveState() {
        // Remove any future history if we pushed new state in middle of stack
        if (historyIndex < drawHistory.length - 1) {
          drawHistory = drawHistory.slice(0, historyIndex + 1);
        }
        drawHistory.push(JSON.stringify(gridData));
        if (drawHistory.length > 30) drawHistory.shift(); // Limit
        historyIndex = drawHistory.length - 1;
      }

      function undo() {
        if (historyIndex > 0) {
          historyIndex--;
          gridData = JSON.parse(drawHistory[historyIndex]);
          renderCanvas();
        }
      }

      function redo() {
        if (historyIndex < drawHistory.length - 1) {
          historyIndex++;
          gridData = JSON.parse(drawHistory[historyIndex]);
          renderCanvas();
        }
      }
      
      // Update Grid Stamp from Source Image
      function refreshStampBuffer() {
         if (stampMode === 'image' && stampSourceImage) {
            // Calculate target dimensions
            // stampScale is now a multiplier (e.g. 1.0, 0.5, 2.0)
            const targetW = Math.max(1, Math.floor(stampBaseSize.w * stampScale));
            const targetH = Math.max(1, Math.floor(stampBaseSize.h * stampScale));
            
            // Rasterize image at this Target Size
            const oc = document.createElement("canvas");
            oc.width = targetW;
            oc.height = targetH;
            const octx = oc.getContext("2d");
            
            // disable smoothing for pixel art look if desired, or enable for better downscaling
            octx.imageSmoothingEnabled = true; 
            octx.imageSmoothingQuality = 'high';
            
            octx.drawImage(stampSourceImage, 0, 0, targetW, targetH);
            const data = octx.getImageData(0, 0, targetW, targetH).data;

            const buffer = new Array(targetH)
              .fill(null)
              .map(() => new Array(targetW).fill(null));

            for (let y = 0; y < targetH; y++) {
              for (let x = 0; x < targetW; x++) {
                const i = (y * targetW + x) * 4;
                const alpha = data[i + 3];
                if (alpha > 128) {
                  // Convert to hex
                  const hex =
                    "#" +
                    (
                      (1 << 24) +
                      (data[i] << 16) +
                      (data[i + 1] << 8) +
                      data[i + 2]
                    )
                      .toString(16)
                      .slice(1);
                  buffer[y][x] = hex;
                }
              }
            }
            stampBuffer = { w: targetW, h: targetH, data: buffer };
         }
         // For Text, stampScale is just a draw multiplier, buffer doesn't change
      }

      // Key bindings for undo/redo
      // Key bindings
      document.addEventListener("keydown", (e) => {
        // Undo/Redo
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
          e.preventDefault();
          if (e.shiftKey) redo();
          else undo();
        }
        
        // Escape to cancel stamp
        if (e.key === "Escape" && stampMode) {
          stampMode = null;
          document.getElementById("stamp-hint").classList.add("hidden");
          canvas.style.cursor = "crosshair";
          renderCanvas();
        }

        // Tools (only if not typing in an input)
        if (document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
           if (e.key.toLowerCase() === "b") setDrawTool('brush');
           if (e.key.toLowerCase() === "f") setDrawTool('fill');
           if (e.key.toLowerCase() === "e") setDrawTool('erase');
           
           // Stamp Scaling
           if (stampMode) {
             if (e.key === "+" || e.key === "=") {
               if (stampMode === 'text') stampScale = Math.floor(stampScale) + 1;
               else stampScale = parseFloat((stampScale + 0.1).toFixed(1));
               refreshStampBuffer();
               renderCanvas();
             }
             if (e.key === "-") {
               if (stampMode === 'text' && stampScale > 1) stampScale = Math.floor(stampScale) - 1;
               else if (stampMode === 'image' && stampScale > 0.15) stampScale = parseFloat((stampScale - 0.1).toFixed(1));
               refreshStampBuffer();
               renderCanvas();
             }
           }
        }
      });
      
      // Wheel for Scaling Ghost
      window.addEventListener("wheel", (e) => {
        if (!stampMode) return;
        const delta = e.deltaY < 0 ? 1 : -1;
        
        if (stampMode === 'text') {
           if (delta > 0) stampScale++;
           else if (delta < 0 && stampScale > 1) stampScale--;
        } else {
           // Float scaling for images
           if (delta > 0) stampScale = parseFloat((stampScale + 0.1).toFixed(1));
           else if (delta < 0 && stampScale > 0.15) stampScale = parseFloat((stampScale - 0.1).toFixed(1));
           
           refreshStampBuffer();
        }
        renderCanvas();
      }, { passive: true });

      // Rendering Loop
      function renderCanvas() {
        // Background
        ctx.fillStyle = "#111827";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Grid Lines
        ctx.strokeStyle = "#374151";
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 0; x <= GRID_W; x++)
          ctx.rect(x * PIXEL_SIZE, 0, 0, canvas.height);
        for (let y = 0; y <= GRID_H; y++)
          ctx.rect(0, y * PIXEL_SIZE, canvas.width, 0);
        ctx.stroke();

        // Active Pixels
        for (let y = 0; y < GRID_H; y++) {
          for (let x = 0; x < GRID_W; x++) {
            if (gridData[y][x]) {
              ctx.fillStyle = gridData[y][x];
              ctx.fillRect(
                x * PIXEL_SIZE + 1,
                y * PIXEL_SIZE + 1,
                PIXEL_SIZE - 2,
                PIXEL_SIZE - 2
              );
            }
          }
        }

        // Stamp Overlay (Ghost)
        // Stamp Overlay (Ghost)
        if (stampMode && stampBuffer) {
          const cx = Math.floor(mouseX / PIXEL_SIZE);
          const cy = Math.floor(mouseY / PIXEL_SIZE);

          // Render Logic:
          // For TEXT: stampBuffer is constant 1x size, we scale it by drawing big blocks (stampScale is int)
          // For IMAGE: stampBuffer is ALREADY RESIZED by refreshStampBuffer(), so we draw it 1:1 (stampScale is float, but processed into buffer)
          let renderScale = 1;
          let drawW = stampBuffer.w;
          let drawH = stampBuffer.h;
          
          if (stampMode === 'text') {
             renderScale = stampScale;
             drawW = stampBuffer.w * renderScale;
             drawH = stampBuffer.h * renderScale;
          }

          // Center the stamp
          const startX = cx - Math.floor(drawW / 2);
          const startY = cy - Math.floor(drawH / 2);

          ctx.globalAlpha = 0.5; // Ghost effect
          
          // Draw pixels
          for (let sy = 0; sy < stampBuffer.h; sy++) {
            for (let sx = 0; sx < stampBuffer.w; sx++) {
              const col = stampBuffer.data[sy][sx];
              if (col) {
                const originX = startX + (sx * renderScale);
                const originY = startY + (sy * renderScale);
                
                ctx.fillStyle = col;
                ctx.fillRect(
                  originX * PIXEL_SIZE,
                  originY * PIXEL_SIZE,
                  PIXEL_SIZE * renderScale,
                  PIXEL_SIZE * renderScale
                );
              }
            }
          }
          
          ctx.globalAlpha = 1.0;

          // Draw bounding box
          ctx.strokeStyle = "#fbbf24"; // Yellow
          ctx.lineWidth = 2;
          ctx.strokeRect(
            startX * PIXEL_SIZE,
            startY * PIXEL_SIZE,
            drawW * PIXEL_SIZE,
            drawH * PIXEL_SIZE
          );

          // Show scale indicator
          ctx.fillStyle = "#fbbf24";
          ctx.font = "bold 12px sans-serif";
          ctx.fillText(`x${stampScale}`, (startX + drawW) * PIXEL_SIZE + 5, startY * PIXEL_SIZE + 15);
        }
      }

      // Tools Logic
      function setDrawTool(tool) {
        currentDrawTool = tool;
        stampMode = null; // Cancel stamp
        document.getElementById("stamp-hint").classList.add("hidden");

        ["brush", "fill", "erase"].forEach((t) =>
          document.getElementById(`btn-${t}`).classList.remove("active")
        );
        document.getElementById(`btn-${tool}`).classList.add("active");
        canvas.style.cursor = tool === "fill" ? "alias" : "crosshair";
      }

      function useTool(x, y) {
        if (x < 0 || x >= GRID_W || y < 0 || y >= GRID_H) return;
        const color = document.getElementById("draw-color").value;

        if (currentDrawTool === "brush") {
          if (gridData[y][x] !== color) {
            gridData[y][x] = color;
            renderCanvas();
          }
        } else if (currentDrawTool === "erase") {
          if (gridData[y][x] !== null) {
            gridData[y][x] = null;
            renderCanvas();
          }
        } else if (currentDrawTool === "fill") {
          floodFill(x, y, color);
          renderCanvas();
          saveState(); // Fill is single-click, save immediately
        }
      }

      function floodFill(sx, sy, fillColor) {
        const targetColor = gridData[sy][sx];
        if (targetColor === fillColor) return;

        const stack = [[sx, sy]];
        while (stack.length) {
          const [x, y] = stack.pop();
          if (x < 0 || x >= GRID_W || y < 0 || y >= GRID_H) continue;
          if (gridData[y][x] !== targetColor) continue;

          gridData[y][x] = fillColor;
          stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
        }
      }

      function commitStamp() {
        if (!stampMode || !stampBuffer) return;

        const cx = Math.floor(mouseX / PIXEL_SIZE);
        const cy = Math.floor(mouseY / PIXEL_SIZE);
        
        let renderScale = 1;
          let drawW = stampBuffer.w;
          let drawH = stampBuffer.h;
          
          if (stampMode === 'text') {
             renderScale = stampScale;
             drawW = stampBuffer.w * renderScale;
             drawH = stampBuffer.h * renderScale;
          }
        
        const startX = cx - Math.floor(drawW / 2);
        const startY = cy - Math.floor(drawH / 2);

        let changed = false;
        
        for (let sy = 0; sy < stampBuffer.h; sy++) {
          for (let sx = 0; sx < stampBuffer.w; sx++) {
            const col = stampBuffer.data[sy][sx];
            if (col) {
              // Fill the scaled block (only applies if renderScale > 1, i.e. TEXT mode)
              // For Image mode, renderScale is 1, loop runs once.
              for (let dy = 0; dy < renderScale; dy++) {
                for (let dx = 0; dx < renderScale; dx++) {
                   const gx = startX + (sx * renderScale) + dx;
                   const gy = startY + (sy * renderScale) + dy;
                   
                   if (gx >= 0 && gx < GRID_W && gy >= 0 && gy < GRID_H) {
                     gridData[gy][gx] = col;
                     changed = true;
                   }
                }
              }
            }
          }
        }

        if (changed) {
          saveState();
          renderCanvas();
        }

        // Auto cancel stamp after placement
        stampMode = null;
        document.getElementById("stamp-hint").classList.add("hidden");
        canvas.style.cursor = "crosshair";
        renderCanvas();
      }

      // Mouse Events
      function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        // Handle both touch and mouse
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: clientX - rect.left,
          y: clientY - rect.top,
        };
      }

      // Handle drawing events
      // Handle drawing events
      function startDraw(e) {
        // Panning Detection (Right Click or Middle Click)
        if (e.button === 2 || e.button === 1) {
           e.preventDefault();
           isPanning = true;
           panStart = { x: e.clientX, y: e.clientY };
           const viewport = document.getElementById("viewport");
           scrollStart = { x: viewport.scrollLeft, y: viewport.scrollTop };
           return;
        }
        
        // Left Click only for drawing
        if (e.button !== 0) return;

        const { x, y } = getCoords(e);
        if (stampMode) {
          commitStamp();
        } else {
          // One-shot tools: Fill
          if (currentDrawTool === 'fill') {
             const gx = Math.floor(x / PIXEL_SIZE);
             const gy = Math.floor(y / PIXEL_SIZE);
             useTool(gx, gy);
             // Do NOT set isMouseDown for fill, to avoid second saveState in endDraw
          } else {
             isMouseDown = true;
             const gx = Math.floor(x / PIXEL_SIZE);
             const gy = Math.floor(y / PIXEL_SIZE);
             useTool(gx, gy);
          }
        }
      }

      function moveDraw(e) {
        e.preventDefault(); // Prevent scrolling on touch
        
        if (isPanning) {
           const dx = e.clientX - panStart.x;
           const dy = e.clientY - panStart.y;
           const viewport = document.getElementById("viewport");
           viewport.scrollLeft = scrollStart.x - dx;
           viewport.scrollTop = scrollStart.y - dy;
           return;
        }

        const pos = getCoords(e);
        mouseX = pos.x;
        mouseY = pos.y;
        const gx = Math.floor(mouseX / PIXEL_SIZE);
        const gy = Math.floor(mouseY / PIXEL_SIZE);

        document.getElementById("coords").textContent = `X: ${gx}, Y: ${gy}`;

        if (stampMode) {
          renderCanvas(); // Redraw ghost
        } else if (isMouseDown) {
          useTool(gx, gy);
        }
      }

      function endDraw(e) {
        if (isPanning) {
           isPanning = false;
        }
        if (isMouseDown) {
          isMouseDown = false;
          saveState(); // Save state after stroke finishes
        }
      }
      
      // Prevent context menu on canvas for Right Click Panning
      canvas.addEventListener("contextmenu", e => e.preventDefault());

      // Mouse Listeners
      canvas.addEventListener("mousedown", startDraw);
      canvas.addEventListener("mousemove", moveDraw);
      window.addEventListener("mouseup", endDraw);

      // Touch Listeners (Mobile support)
      canvas.addEventListener(
        "touchstart",
        (e) => {
          if (e.touches.length === 1) startDraw(e);
        },
        { passive: false }
      );
      canvas.addEventListener("touchmove", moveDraw, { passive: false });
      canvas.addEventListener("touchend", endDraw);

      // Stamp Generators
      function activateTextStamp() {
        const text = document
          .getElementById("draw-text-input")
          .value.toUpperCase();
        if (!text) return;
        const color = document.getElementById("draw-color").value;

        // Generate buffer
        // CORRECTED: Calculate exact width to avoid extra pixel border
        // (5 pixels per char) + (1 pixel spacing BETWEEN chars)
        let w = 0;
        const h = 5;
        if (text.length > 0) {
           w = (text.length * 5) + (Math.max(0, text.length - 1));
        }

        const buffer = new Array(h)
          .fill(null)
          .map(() => new Array(w).fill(null));

        let cursor = 0;
        for (let idx = 0; idx < text.length; idx++) {
          const char = text[idx];
          const map = FACTORIO_FONT[char];
          
          if (!map) {
             // If unknown char, just skip space (though FONT is comprehensive?)
             // Or maybe space char
             cursor += 6;
             continue;
          }
          
          for (let r = 0; r < 5; r++) {
            for (let c = 0; c < 5; c++) {
              if (map[r * 5 + c]) buffer[r][cursor + c] = color;
            }
          }
          cursor += 6; // 5 width + 1 spacing
        }
        
        stampScale = 1; // Reset scale on new stamp

        stampBuffer = { w, h, data: buffer };
        stampMode = "text";
        document.getElementById("stamp-hint").classList.remove("hidden");
        canvas.style.cursor = "none"; // Hide default cursor so ghost is visible
      }

      function activateImageStamp(input) {
        if (input.files && input.files[0]) {
          const reader = new FileReader();
          reader.onload = function (e) {
            const img = new Image();
            img.onload = function () {
              stampSourceImage = img; // Save original
              
              // Determine Base "1.0" fit
              // Max stamp size 30x30 to prevent huge lag for Base, but user can scale up
              const fitInfo = Math.min(1, 30 / img.width, 30 / img.height);
              
              const baseW = Math.floor(img.width * fitInfo);
              const baseH = Math.floor(img.height * fitInfo);
              
              stampBaseSize = { w: baseW, h: baseH };
              stampScale = 1.0; 
              stampMode = "image";
              
              refreshStampBuffer();

              document.getElementById("stamp-hint").classList.remove("hidden");
              canvas.style.cursor = "none";
              document.getElementById("img-upload").value = ""; // Reset
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(input.files[0]);
        }
      }

      function generateDrawBlueprint() {
        const entities = [];
        let entityId = 1;

        // 1. Calculate Bounding Box
        let minX = GRID_W, minY = GRID_H, maxX = -1, maxY = -1;
        let hasPixels = false;

        for (let y = 0; y < GRID_H; y++) {
          for (let x = 0; x < GRID_W; x++) {
            if (gridData[y][x]) {
               hasPixels = true;
               if (x < minX) minX = x;
               if (x > maxX) maxX = x;
               if (y < minY) minY = y;
               if (y > maxY) maxY = y;
            }
          }
        }

        if (!hasPixels) {
          alert("Canvas is empty!");
          return;
        }

        // 2. Generate Entities shifted by minX, minY
        for (let y = minY; y <= maxY; y++) {
          for (let x = minX; x <= maxX; x++) {
            const hex = gridData[y][x];
            if (hex) {
              const rgb = hexToRgb(hex);
              entities.push({
                entity_number: entityId++,
                name: "small-lamp",
                position: { x: x - minX, y: y - minY },
                color: { r: rgb.r / 255, g: rgb.g / 255, b: rgb.b / 255, a: 1 },
                always_on: true,
              });
            }
          }
        }

        if (entities.length === 0) {
          alert("Canvas is empty!");
          return;
        }

        const bp = {
          blueprint: {
            item: "blueprint",
            label: "Factorio Art",
            entities: entities,
            icons: [{ signal: { type: "item", name: "small-lamp" }, index: 1 }],
            version: 562949958139904,
          },
        };

        const area = document.getElementById("clipboard-target");
        area.value = encodeBlueprint(bp);
        area.select();
        document.execCommand("copy");

        // Show status briefly
        const statusEl = document.getElementById("canvas-status");
        statusEl.textContent = "Blueprint Copied!";
        statusEl.className = "text-green-400 font-bold";
        setTimeout(() => {
          statusEl.textContent = "READY";
          statusEl.className = "font-bold opacity-70";
        }, 3000);
      }

      // Init
      initDraw(); // Creates default grid data to prevent crash in resizeGrid
      resizeGrid(); // Syncs with headers and renders
    </script>
  </body>
</html>
