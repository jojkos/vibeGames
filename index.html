<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jojko's Game Portal</title>
    <!-- Tailwind CSS for layout utilities -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;900&family=Orbitron:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-color: #030712;
        --card-bg: rgba(255, 255, 255, 0.015);
        --card-border: rgba(255, 255, 255, 0.1);
        --spotlight-color: rgba(14, 165, 233, 0.6); /* Sky Blue */
      }

      body {
        background-color: var(--bg-color);
        color: #ffffff;
        font-family: "Inter", sans-serif;
        overflow-x: hidden;
        margin: 0;
        cursor: default;
      }

      /* --- 1. Texture Overlay (Film Grain) --- */
      .noise-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 50;
        opacity: 0.04;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      /* --- 2. Canvas Background --- */
      #starfield {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
      }

      /* --- 3. Typography --- */
      .orbitron {
        font-family: "Orbitron", sans-serif;
      }

      .text-glow {
        text-shadow: 0 0 20px rgba(14, 165, 233, 0.4),
          0 0 40px rgba(14, 165, 233, 0.2);
        background: linear-gradient(to bottom, #ffffff, #94a3b8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* --- 4. The Spotlight Card System --- */
      .game-grid {
        display: grid;
        grid-template-columns: repeat(1, 1fr);
        gap: 1.5rem;
        width: 100%;
        max-width: 1100px;
        position: relative;
        z-index: 10;
      }

      @media (min-width: 640px) {
        .game-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (min-width: 1024px) {
        .game-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      .game-card {
        position: relative;
        height: 180px;
        background-color: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        transition: transform 0.2s ease;
        overflow: hidden;
      }

      .game-card:hover {
        transform: scale(0.98);
      }

      /* Inner Glow Gradient */
      .game-card::before {
        content: "";
        position: absolute;
        height: 100%;
        width: 100%;
        top: 0;
        left: 0;
        background: radial-gradient(
          800px circle at var(--mouse-x) var(--mouse-y),
          rgba(255, 255, 255, 0.06),
          transparent 40%
        );
        opacity: 0;
        transition: opacity 0.5s;
        z-index: 1;
        pointer-events: none;
      }

      /* Border Glow Gradient */
      .game-card::after {
        content: "";
        position: absolute;
        height: 100%;
        width: 100%;
        top: 0;
        left: 0;
        background: radial-gradient(
          600px circle at var(--mouse-x) var(--mouse-y),
          var(--spotlight-color),
          transparent 40%
        );
        opacity: 0;
        transition: opacity 0.5s;
        z-index: 2;
        pointer-events: none;
        -webkit-mask: linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        padding: 1px;
        border-radius: 16px;
      }

      .game-card:hover::before,
      .game-card:hover::after {
        opacity: 1;
      }

      .card-content {
        position: relative;
        z-index: 3;
        text-align: center;
        pointer-events: none;
      }

      /* --- 5. Animations --- */
      @keyframes slideUpFade {
        from {
          opacity: 0;
          transform: translateY(40px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-enter {
        opacity: 0;
        animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* --- 6. Original Coffee Button Style --- */
      .coffee-link {
        position: fixed;
        bottom: 20px;
        right: 20px;
        padding: 12px 18px;
        background: linear-gradient(135deg, #ffdd00, #ffd700);
        color: #1a1a2e;
        border-radius: 12px;
        text-decoration: none;
        font-weight: bold;
        transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        z-index: 1000;
        box-shadow: 0 8px 20px rgba(255, 221, 0, 0.3);
      }

      .coffee-link:hover {
        background: linear-gradient(135deg, #ffe866, #ffdd00);
        transform: translateY(-3px) scale(1.05);
        box-shadow: 0 15px 30px rgba(255, 221, 0, 0.4);
      }
    </style>
  </head>
  <body class="flex flex-col items-center min-h-screen p-4 sm:p-8">
    <!-- Visual Layers -->
    <div class="noise-overlay"></div>
    <canvas id="starfield"></canvas>

    <!-- Main Content -->
    <main
      class="w-full max-w-7xl flex flex-col items-center z-10 pt-12 sm:pt-20"
    >
      <!-- Header -->
      <header class="text-center mb-16 animate-enter">
        <h1
          class="orbitron text-5xl sm:text-7xl font-black mb-4 tracking-tight text-glow"
        >
          JOJKO'S GAMES
        </h1>
        <p
          class="text-slate-400 font-light text-lg tracking-wide max-w-lg mx-auto"
        >
          Choose your destination.
        </p>
      </header>

      <!-- Dynamic Game Grid -->
      <div id="game-grid-container" class="game-grid mb-24">
        <!-- Javascript will inject cards here -->
      </div>
    </main>

    <!-- Original Coffee Button -->
    <a
      href="https://buymeacoffee.com/jojkos"
      target="_blank"
      rel="noopener noreferrer"
      class="coffee-link"
    >
      ☕ Buy Me a Coffee
    </a>

    <!-- JAVASCRIPT LOGIC -->
    <script>
      // ---------------------------------------------------------
      // 1. CONFIGURATION: Manage your games here
      // ---------------------------------------------------------
      const games = [
        { name: "Pug Fiesta", url: "pugFiesta/index.html" },
        { name: "Zoopaloola", url: "https://zoopaloola.vercel.app/" },
        { name: "Factorio Lamp Text Builder", url: "factorioText/index.html" },
        { name: "Bluff Helper", url: "bluff/index.html" },
        { name: "Calendar Puzzle", url: "calendarPuzzle/index.html" },
        { name: "Pokemon Shooter", url: "pokemonShooter/index.html" },
        { name: "Tralala Clicker", url: "tralalaGame/index.html" },
        { name: "LoL Wheel", url: "lolWheel/index.html" },
        { name: "Neon Drifter", url: "neonDrifter/index.html" },
        { name: "Guitar Tuner", url: "guitarTuner/index.html" },
      ];

      // ---------------------------------------------------------
      // 2. DOM GENERATION
      // ---------------------------------------------------------
      const gridContainer = document.getElementById("game-grid-container");

      function createCards() {
        let delay = 0.2; // Fast start

        games.forEach((game) => {
          const card = document.createElement("a");
          card.href = game.url;
          card.className = "game-card animate-enter group";
          card.style.animationDelay = `${delay}s`;

          // Increment delay for cascading effect
          delay += 0.1;

          card.innerHTML = `
            <div class="card-content">
               <div class="w-12 h-12 mb-4 rounded-full bg-slate-800/50 flex items-center justify-center mx-auto border border-white/5 group-hover:border-sky-500/30 group-hover:bg-sky-500/10 transition-all duration-300">
                  <span class="text-slate-400 group-hover:text-sky-400 text-xl transition-colors">▶</span>
               </div>
               <h3 class="orbitron text-xl font-bold text-slate-200 group-hover:text-white transition-colors tracking-wider">
                  ${game.name.toUpperCase()}
               </h3>
            </div>
          `;

          // SPOTLIGHT EFFECT LOGIC
          card.addEventListener("mousemove", (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Set CSS variables for the gradient position
            card.style.setProperty("--mouse-x", `${x}px`);
            card.style.setProperty("--mouse-y", `${y}px`);
          });

          gridContainer.appendChild(card);
        });
      }

      // ---------------------------------------------------------
      // 3. CANVAS STARFIELD BACKGROUND
      // ---------------------------------------------------------
      const canvas = document.getElementById("starfield");
      const ctx = canvas.getContext("2d");

      let width, height;
      let stars = [];
      let mouseX = 0,
        mouseY = 0;

      // Handle Resize
      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resize);
      resize();

      // Track Mouse for Parallax
      document.addEventListener("mousemove", (e) => {
        // Calculate offset from center
        mouseX = (e.clientX - width / 2) * 0.1;
        mouseY = (e.clientY - height / 2) * 0.1;
      });

      // Star Object
      class Star {
        constructor() {
          this.reset();
          // Initialize with random Z so they don't all start at the back
          this.z = Math.random() * width;
        }

        reset() {
          this.x = (Math.random() - 0.5) * width * 2; // Spread wide
          this.y = (Math.random() - 0.5) * height * 2;
          this.z = width; // Start far away
          this.size = Math.random() * 2 + 0.5;
          this.opacity = Math.random();
        }

        update() {
          this.z -= 2; // Speed of stars moving towards screen

          if (this.z <= 0) {
            this.reset();
          }
        }

        draw() {
          // 3D Projection Math
          // x_screen = x_world / z * fov
          const x = (this.x / this.z) * width + width / 2 - mouseX;
          const y = (this.y / this.z) * height + height / 2 - mouseY;

          // Scale size based on proximity
          const radius = (1 - this.z / width) * this.size * 2;

          if (x < 0 || x > width || y < 0 || y > height) return;

          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);

          // Fade in as they get closer
          const alpha = 1 - this.z / width;
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
          ctx.fill();
        }
      }

      // Create Stars
      for (let i = 0; i < 300; i++) {
        stars.push(new Star());
      }

      // Animation Loop
      function animate() {
        // Clear with slight transparency for potential trails (optional, currently solid clear)
        ctx.clearRect(0, 0, width, height);

        stars.forEach((star) => {
          star.update();
          star.draw();
        });

        requestAnimationFrame(animate);
      }
      animate();

      // ---------------------------------------------------------
      // 4. INIT
      // ---------------------------------------------------------
      window.addEventListener("DOMContentLoaded", () => {
        createCards();
      });
    </script>
  </body>
</html>
