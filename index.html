<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jojko's Game Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;900&family=Orbitron:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-color: #030712;
        --card-bg: rgba(15, 23, 42, 0.6);
        --card-border: rgba(100, 116, 139, 0.3);
        --spotlight-color: rgba(14, 165, 233, 0.6);
        --accent-cyan: #06b6d4;
        --accent-purple: #a855f7;
        --accent-pink: #ec4899;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background-color: var(--bg-color);
        color: #ffffff;
        font-family: "Inter", sans-serif;
        overflow-x: hidden;
        margin: 0;
        cursor: default;
      }

      body {
        cursor: default;
      }

      .noise-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 50;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      #starfield {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
      }

      /* Floating Particles */
      .particle {
        position: fixed;
        width: 3px;
        height: 3px;
        background: linear-gradient(
          45deg,
          var(--accent-cyan),
          var(--accent-purple)
        );
        border-radius: 50%;
        pointer-events: none;
        z-index: 1;
        opacity: 0;
        box-shadow: 0 0 10px currentColor;
      }

      @keyframes float-particle {
        0% {
          opacity: 0;
          transform: translateY(0) translateX(0) scale(0);
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 0.8;
        }
        100% {
          opacity: 0;
          transform: translateY(-150px) translateX(var(--drift-x)) scale(1.5);
        }
      }

      .orbitron {
        font-family: "Orbitron", sans-serif;
      }

      .text-glow {
        text-shadow: 0 0 30px rgba(14, 165, 233, 0.5),
          0 0 60px rgba(14, 165, 233, 0.3), 0 0 90px rgba(168, 85, 247, 0.2);
        background: linear-gradient(135deg, #ffffff, #06b6d4, #a855f7);
        background-size: 200% 200%;
        animation: gradient-shift 3s ease infinite;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      @keyframes gradient-shift {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }

      /* Grid with breathing effect */
      .game-grid {
        display: grid;
        grid-template-columns: repeat(1, 1fr);
        gap: 2rem;
        width: 100%;
        max-width: 1100px;
        position: relative;
        z-index: 10;
      }

      @media (min-width: 640px) {
        .game-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (min-width: 1024px) {
        .game-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      .game-card {
        position: relative;
        height: 200px;
        background: var(--card-bg);
        backdrop-filter: blur(10px);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        overflow: hidden;
        transform-style: preserve-3d;
      }

      .game-card:hover {
        transform: translateY(-8px) scale(1.02);
        border-color: rgba(14, 165, 233, 0.6);
        box-shadow: 0 20px 60px rgba(14, 165, 233, 0.3),
          0 0 80px rgba(168, 85, 247, 0.2),
          inset 0 0 100px rgba(14, 165, 233, 0.05);
      }

      /* Animated gradient border */
      .game-card::before {
        content: "";
        position: absolute;
        inset: -2px;
        background: linear-gradient(
          45deg,
          transparent,
          var(--accent-cyan),
          var(--accent-purple),
          var(--accent-pink),
          transparent
        );
        background-size: 400% 400%;
        border-radius: 20px;
        opacity: 0;
        transition: opacity 0.5s;
        z-index: -1;
        animation: border-flow 8s linear infinite;
      }

      @keyframes border-flow {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }

      .game-card:hover::before {
        opacity: 0.6;
      }

      /* Spotlight effect */
      .game-card::after {
        content: "";
        position: absolute;
        height: 100%;
        width: 100%;
        top: 0;
        left: 0;
        background: radial-gradient(
          500px circle at var(--mouse-x) var(--mouse-y),
          rgba(14, 165, 233, 0.15),
          transparent 50%
        );
        opacity: 0;
        transition: opacity 0.3s;
        z-index: 1;
        pointer-events: none;
      }

      .game-card:hover::after {
        opacity: 1;
      }

      .card-content {
        position: relative;
        z-index: 3;
        text-align: center;
        pointer-events: none;
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      }

      .game-card:hover .card-content {
        transform: translateZ(20px);
      }

      .play-icon {
        width: 60px;
        height: 60px;
        margin: 0 auto 1rem;
        border-radius: 50%;
        background: linear-gradient(
          135deg,
          rgba(14, 165, 233, 0.1),
          rgba(168, 85, 247, 0.1)
        );
        border: 2px solid rgba(100, 116, 139, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        position: relative;
        overflow: hidden;
      }

      .play-icon::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          var(--accent-cyan),
          var(--accent-purple)
        );
        opacity: 0;
        transition: opacity 0.4s;
      }

      .game-card:hover .play-icon {
        transform: scale(1.1) rotate(10deg);
        border-color: var(--accent-cyan);
        box-shadow: 0 0 30px rgba(14, 165, 233, 0.5);
      }

      .game-card:hover .play-icon::before {
        opacity: 0.2;
      }

      .play-icon svg {
        width: 24px;
        height: 24px;
        fill: #94a3b8;
        transition: all 0.4s;
        position: relative;
        z-index: 1;
      }

      .game-card:hover .play-icon svg {
        fill: var(--accent-cyan);
        transform: translateX(2px);
      }

      .game-title {
        font-family: "Orbitron", sans-serif;
        font-size: 1.25rem;
        font-weight: 700;
        color: #cbd5e1;
        letter-spacing: 0.1em;
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      }

      .game-card:hover .game-title {
        color: #ffffff;
        text-shadow: 0 0 20px rgba(14, 165, 233, 0.8),
          0 0 40px rgba(168, 85, 247, 0.4);
        letter-spacing: 0.15em;
      }

      /* Entrance animations */
      @keyframes slideUpFade {
        from {
          opacity: 0;
          transform: translateY(60px) scale(0.95);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes titleGlitch {
        0%,
        100% {
          transform: translate(0);
          text-shadow: 0 0 30px rgba(14, 165, 233, 0.5),
            0 0 60px rgba(14, 165, 233, 0.3);
        }
        20% {
          transform: translate(-2px, 2px);
          text-shadow: 2px 0 var(--accent-cyan), -2px 0 var(--accent-pink);
        }
        40% {
          transform: translate(-2px, -2px);
        }
        60% {
          transform: translate(2px, 2px);
        }
        80% {
          transform: translate(2px, -2px);
        }
      }

      .animate-enter {
        opacity: 0;
        animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .title-container {
        position: relative;
        display: inline-block;
      }

      .title-container:hover .text-glow {
        animation: titleGlitch 0.5s ease;
      }

      /* Coffee button upgrade */
      .coffee-link {
        position: fixed;
        bottom: 30px;
        right: 30px;
        padding: 14px 24px;
        background: linear-gradient(135deg, #fbbf24, #f59e0b);
        color: #1a1a2e;
        border-radius: 50px;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.95rem;
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        z-index: 1000;
        box-shadow: 0 10px 30px rgba(251, 191, 36, 0.3),
          0 0 0 0 rgba(251, 191, 36, 0.4);
        display: flex;
        align-items: center;
        gap: 8px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
      }

      .coffee-link:hover {
        background: linear-gradient(135deg, #fcd34d, #fbbf24);
        transform: translateY(-5px) scale(1.05);
        box-shadow: 0 20px 40px rgba(251, 191, 36, 0.5),
          0 0 0 10px rgba(251, 191, 36, 0.1);
        border-color: rgba(255, 255, 255, 0.4);
      }

      .coffee-link:active {
        transform: translateY(-2px) scale(1.02);
      }

      /* Scan line effect - REMOVED */
    </style>
  </head>
  <body class="flex flex-col items-center min-h-screen p-4 sm:p-8">
    <!-- Visual Layers -->
    <div class="noise-overlay"></div>
    <canvas id="starfield"></canvas>

    <!-- Main Content -->
    <main
      class="w-full max-w-7xl flex flex-col items-center z-10 pt-12 sm:pt-20"
    >
      <!-- Header -->
      <header class="text-center mb-20 animate-enter">
        <div class="title-container">
          <h1
            class="orbitron text-5xl sm:text-7xl font-black mb-6 tracking-tight text-glow"
          >
            JOJKO'S GAMES
          </h1>
        </div>
        <p
          class="text-slate-400 font-light text-lg tracking-wide max-w-lg mx-auto opacity-0 animate-enter"
          style="animation-delay: 0.2s"
        >
          Choose your destination. Enter the arena.
        </p>
      </header>

      <!-- Dynamic Game Grid -->
      <div id="game-grid-container" class="game-grid mb-24">
        <!-- Javascript will inject cards here -->
      </div>
    </main>

    <!-- Enhanced Coffee Button -->
    <a
      href="https://buymeacoffee.com/jojkos"
      target="_blank"
      rel="noopener noreferrer"
      class="coffee-link"
    >
      <span style="font-size: 1.2rem">☕</span>
      <span>Buy Me a Coffee</span>
    </a>

    <script>
      // ---------------------------------------------------------
      // CONFIGURATION
      // ---------------------------------------------------------
      const games = [
        { name: "Pug Fiesta", url: "pugFiesta/index.html" },
        { name: "Zoopaloola", url: "https://zoopaloola.vercel.app/" },
        { name: "Factorio Lamp Text Builder", url: "factorioText/index.html" },
        { name: "Combat Arena", url: "https://combatarena.onrender.com/" },
        { name: "Bluff Helper", url: "bluff/index.html" },
        { name: "Calendar Puzzle", url: "calendarPuzzle/index.html" },
        { name: "Pokemon Shooter", url: "pokemonShooter/index.html" },
        { name: "Tralala Clicker", url: "tralalaGame/index.html" },
        { name: "LoL Wheel", url: "lolWheel/index.html" },
        { name: "Neon Drifter", url: "neonDrifter/index.html" },
        { name: "Guitar Tuner", url: "guitarTuner/index.html" },
      ];

      // ---------------------------------------------------------
      // PARTICLE SYSTEM ON MOUSE MOVE
      // ---------------------------------------------------------
      let lastParticleTime = 0;
      const maxParticles = 50; // Limit particles
      let particleCount = 0;

      document.addEventListener("mousemove", (e) => {
        const now = Date.now();
        if (now - lastParticleTime < 30) return; // Throttle
        lastParticleTime = now;

        // Remove old particles if at limit
        if (particleCount >= maxParticles) {
          const oldParticle = document.querySelector(".particle");
          if (oldParticle) {
            oldParticle.remove();
            particleCount--;
          }
        }

        const particle = document.createElement("div");
        particle.className = "particle";
        particle.style.left = e.clientX + "px";
        particle.style.top = e.clientY + "px";

        // Random drift direction
        const driftX = (Math.random() - 0.5) * 100;
        particle.style.setProperty("--drift-x", driftX + "px");

        // Random color variation
        const hue = Math.random() > 0.5 ? 190 : 280; // Cyan or Purple
        particle.style.background = `hsl(${hue}, 70%, 60%)`;

        const duration = 2 + Math.random() * 2; // 2-4 seconds
        particle.style.animation = `float-particle ${duration}s ease-out forwards`;

        document.body.appendChild(particle);
        particleCount++;

        setTimeout(() => {
          particle.remove();
          particleCount--;
        }, duration * 1000);
      });

      // ---------------------------------------------------------
      // DOM GENERATION
      // ---------------------------------------------------------
      const gridContainer = document.getElementById("game-grid-container");

      function createCards() {
        let delay = 0.3;

        games.forEach((game) => {
          const card = document.createElement("a");
          card.href = game.url;
          card.className = "game-card animate-enter";
          card.style.animationDelay = `${delay}s`;
          delay += 0.08;

          card.innerHTML = `
            <div class="card-content">
              <div class="play-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M8 5v14l11-7z"/>
                </svg>
              </div>
              <h3 class="game-title">
                ${game.name.toUpperCase()}
              </h3>
            </div>
          `;

          // Spotlight + 3D tilt effect
          card.addEventListener("mousemove", (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            card.style.setProperty("--mouse-x", `${x}px`);
            card.style.setProperty("--mouse-y", `${y}px`);

            // 3D tilt
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = (y - centerY) / 10;
            const rotateY = (centerX - x) / 10;

            card.style.transform = `
              translateY(-8px) 
              scale(1.02)
              perspective(1000px)
              rotateX(${rotateX}deg)
              rotateY(${rotateY}deg)
            `;
          });

          card.addEventListener("mouseleave", () => {
            card.style.transform = "";
          });

          card.addEventListener("mouseenter", () => {
            // Hover effect handled by CSS
          });

          card.addEventListener("mouseleave", () => {
            // Hover effect handled by CSS
          });

          gridContainer.appendChild(card);
        });
      }

      // ---------------------------------------------------------
      // CANVAS STARFIELD BACKGROUND
      // ---------------------------------------------------------
      const canvas = document.getElementById("starfield");
      const ctx = canvas.getContext("2d");

      let width, height;
      let stars = [];
      let mouseX = 0,
        mouseY = 0;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resize);
      resize();

      document.addEventListener("mousemove", (e) => {
        mouseX = (e.clientX - width / 2) * 0.05;
        mouseY = (e.clientY - height / 2) * 0.05;
      });

      class Star {
        constructor() {
          this.reset();
          this.z = Math.random() * width;
        }

        reset() {
          this.x = (Math.random() - 0.5) * width * 2;
          this.y = (Math.random() - 0.5) * height * 2;
          this.z = width;
          this.size = Math.random() * 2 + 0.5;
        }

        update() {
          this.z -= 2.5;
          if (this.z <= 0) this.reset();
        }

        draw() {
          const x = (this.x / this.z) * width + width / 2 - mouseX;
          const y = (this.y / this.z) * height + height / 2 - mouseY;
          const radius = (1 - this.z / width) * this.size * 2.5;

          if (x < -50 || x > width + 50 || y < -50 || y > height + 50) return;

          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);

          const alpha = 1 - this.z / width;
          const hue = 200 + alpha * 60;
          ctx.fillStyle = `hsla(${hue}, 70%, 70%, ${alpha * 0.8})`;
          ctx.fill();

          // Glow effect
          if (alpha > 0.7) {
            ctx.shadowBlur = 15;
            ctx.shadowColor = `hsla(${hue}, 100%, 60%, ${alpha})`;
          } else {
            ctx.shadowBlur = 0;
          }
        }
      }

      for (let i = 0; i < 400; i++) {
        stars.push(new Star());
      }

      function animate() {
        ctx.fillStyle = "rgba(3, 7, 18, 0.1)";
        ctx.fillRect(0, 0, width, height);

        stars.forEach((star) => {
          star.update();
          star.draw();
        });

        requestAnimationFrame(animate);
      }
      animate();

      // ---------------------------------------------------------
      // INIT
      // ---------------------------------------------------------
      window.addEventListener("DOMContentLoaded", () => {
        createCards();
      });
    </script>
  </body>
</html>
