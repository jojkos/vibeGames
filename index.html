<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jojko's Game Portal</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --neon-cyan: #00fff5;
        --neon-magenta: #ff00ff;
        --deep-void: #0a0a0f;
        --card-bg: rgba(15, 15, 25, 0.9);
        --card-border: rgba(0, 255, 245, 0.15);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--deep-void);
        color: #fff;
        font-family: "Inter", sans-serif;
        min-height: 100vh;
        background-image: radial-gradient(
            ellipse at 50% 0%,
            rgba(0, 255, 245, 0.08) 0%,
            transparent 50%
          ),
          linear-gradient(180deg, #0a0a0f 0%, #0f0f1a 100%);
      }

      /* Simple grid pattern - pure CSS, no JS */
      .grid-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image: linear-gradient(
            rgba(0, 255, 245, 0.03) 1px,
            transparent 1px
          ),
          linear-gradient(90deg, rgba(0, 255, 245, 0.03) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: linear-gradient(
          to bottom,
          transparent 0%,
          black 20%,
          black 60%,
          transparent 100%
        );
        -webkit-mask-image: linear-gradient(
          to bottom,
          transparent 0%,
          black 20%,
          black 60%,
          transparent 100%
        );
      }

      .main-content {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem;
        min-height: 100vh;
      }

      header {
        text-align: center;
        padding: 3rem 0 2rem;
      }

      .title {
        font-family: "Orbitron", sans-serif;
        font-size: clamp(2rem, 7vw, 4rem);
        font-weight: 900;
        background: linear-gradient(
          135deg,
          #fff,
          var(--neon-cyan),
          var(--neon-magenta)
        );
        background-size: 200% 200%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: gradient-shift 6s ease infinite;
      }

      @keyframes gradient-shift {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }

      .subtitle {
        font-size: 1rem;
        color: rgba(255, 255, 255, 0.5);
        margin-top: 0.75rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .game-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.5rem;
        padding: 2rem 0 4rem;
      }

      .game-card {
        position: relative;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 2rem 1.5rem;
        text-decoration: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        transition: transform 0.2s ease, border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      .game-card:hover {
        transform: translateY(-4px);
        border-color: var(--neon-cyan);
        box-shadow: 0 8px 32px rgba(0, 255, 245, 0.15);
      }

      .game-card:focus {
        outline: none;
        border-color: var(--neon-cyan);
        box-shadow: 0 0 0 3px rgba(0, 255, 245, 0.2);
      }

      .play-icon {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: linear-gradient(
          135deg,
          rgba(0, 255, 245, 0.1),
          rgba(255, 0, 255, 0.1)
        );
        border: 2px solid rgba(0, 255, 245, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s ease, border-color 0.2s ease;
      }

      .game-card:hover .play-icon {
        transform: scale(1.1);
        border-color: var(--neon-cyan);
      }

      .play-icon svg {
        width: 24px;
        height: 24px;
        fill: var(--neon-cyan);
        opacity: 0.8;
        transition: opacity 0.2s ease;
      }

      .game-card:hover .play-icon svg {
        opacity: 1;
      }

      .game-title {
        font-family: "Orbitron", sans-serif;
        font-size: 0.9rem;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.85);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-align: center;
        transition: color 0.2s ease;
      }

      .game-card:hover .game-title {
        color: #fff;
      }

      .coffee-link {
        position: fixed;
        bottom: 24px;
        right: 24px;
        padding: 12px 20px;
        background: linear-gradient(135deg, #fbbf24, #f59e0b);
        color: #000;
        border-radius: 50px;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        z-index: 100;
        box-shadow: 0 4px 16px rgba(251, 191, 36, 0.25);
      }

      .coffee-link:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(251, 191, 36, 0.35);
      }

      /* Keyboard navigation */
      .nav-hint {
        position: fixed;
        bottom: 24px;
        left: 24px;
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.35);
        display: flex;
        gap: 1rem;
        z-index: 100;
      }

      .nav-hint kbd {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 24px;
        height: 24px;
        padding: 0 6px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 4px;
        font-family: inherit;
        font-size: 0.8rem;
      }

      @media (max-width: 640px) {
        .nav-hint {
          display: none;
        }
        .coffee-link {
          bottom: 16px;
          right: 16px;
          padding: 10px 16px;
          font-size: 0.85rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="grid-bg"></div>

    <main class="main-content">
      <header>
        <h1 class="title">JOJKO'S GAMES</h1>
        <p class="subtitle">Select Your Destination</p>
      </header>

      <div class="game-grid" id="game-grid"></div>
    </main>

    <div class="nav-hint">
      <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> Navigate</span>
      <span><kbd>Enter</kbd> Select</span>
    </div>

    <a
      href="https://buymeacoffee.com/jojkos"
      target="_blank"
      rel="noopener noreferrer"
      class="coffee-link"
    >
      <span>☕</span>
      <span>Buy Me a Coffee</span>
    </a>

    <script>
      const games = [
        { name: "Pug Fiesta", url: "pugFiesta/index.html" },
        { name: "Zoopaloola", url: "https://zoopaloola.vercel.app/" },
        {
          name: "Factorio Lamp Editor",
          url: "https://factorio-lamp-editor.vercel.app/",
        },
        { name: "Combat Arena", url: "https://combatarena.onrender.com/" },
        { name: "Bluff Helper", url: "bluff/index.html" },
        {
          name: "Calendar Puzzle",
          url: "https://calendar-puzzle2.vercel.app/",
        },
        { name: "Pokemon Shooter", url: "pokemonShooter/index.html" },
        { name: "Tralala Clicker", url: "tralalaGame/index.html" },
        { name: "LoL Fusion loldle", url: "https://lol-fusion.vercel.app/" },
        { name: "LoL Wheel", url: "lolWheel/index.html" },
        { name: "Neon Drifter", url: "neonDrifter/index.html" },
        { name: "Guitar Tuner", url: "guitarTuner/index.html" },
      ];

      // Create cards
      const grid = document.getElementById("game-grid");
      games.forEach((game, index) => {
        const card = document.createElement("a");
        card.href = game.url;
        card.className = "game-card";
        card.setAttribute("data-index", index);
        card.innerHTML = `
          <div class="play-icon">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
          <h3 class="game-title">${game.name}</h3>
        `;
        grid.appendChild(card);
      });

      // Keyboard navigation
      let selectedIndex = -1;
      const cards = document.querySelectorAll(".game-card");

      document.addEventListener("keydown", (e) => {
        const numCards = cards.length;
        const cols =
          window.innerWidth >= 1024 ? 3 : window.innerWidth >= 640 ? 2 : 1;
        const key = e.key;

        let newIndex = selectedIndex;

        if (key === "ArrowRight" || key === "d" || key === "D") {
          e.preventDefault();
          newIndex =
            selectedIndex < 0 ? 0 : Math.min(selectedIndex + 1, numCards - 1);
        } else if (key === "ArrowLeft" || key === "a" || key === "A") {
          e.preventDefault();
          newIndex = Math.max(selectedIndex - 1, 0);
        } else if (key === "ArrowDown" || key === "s" || key === "S") {
          e.preventDefault();
          newIndex =
            selectedIndex < 0
              ? 0
              : Math.min(selectedIndex + cols, numCards - 1);
        } else if (key === "ArrowUp" || key === "w" || key === "W") {
          e.preventDefault();
          newIndex = Math.max(selectedIndex - cols, 0);
        } else if (key === "Enter" && selectedIndex >= 0) {
          e.preventDefault();
          window.location.href = cards[selectedIndex].href;
          return;
        }

        if (newIndex !== selectedIndex) {
          selectedIndex = newIndex;
          cards[selectedIndex].focus();
          cards[selectedIndex].scrollIntoView({
            behavior: "smooth",
            block: "center",
          });
        }
      });
    </script>
  </body>
</html>
