  var v = null;
  try { v = new URLSearchParams(location.search).get('v'); } catch (e){}
  if (v && VALID.indexOf(v) !== -1){
    try { localStorage.setItem('jojkos_variant', v); } catch (e){}
  } else {
    v = null;
  }
  if (!v){
    try { v = localStorage.getItem('jojkos_variant'); } catch (e){}
  }
  if (VALID.indexOf(v) === -1) v = DEFAULT;
  location.replace(v + '/index.html');
})();
</script>
