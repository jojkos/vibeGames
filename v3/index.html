<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JOJKOS GAMES — Select Screen</title>
<meta name="description" content="A pile of little browser games and tools by jojkos. Pick one, press start — Samurai Sword, Jojkos Blaster, Marco Oh No!, Pug Fiesta and more.">
<meta name="theme-color" content="#0e0c1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0c1a; --panel:#1c1832; --ink:#fff; --dim:#a39cc4; --mute:#6f6894; --line:#3b3557;
    --hl:#ffd400; --p1:#ff2e4d; --c:#c3282f;
    --pad:clamp(16px, 3.2vw, 48px);
    --heroW:50vw;
    --ease:cubic-bezier(.2,.9,.25,1);
    --pop:cubic-bezier(.3,1.5,.5,1);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ background:var(--bg); -webkit-text-size-adjust:100%; }
  body{ min-height:100vh; background:var(--bg); color:var(--ink); font-family:'Chakra Petch', system-ui, sans-serif; font-weight:500;
    overflow-x:hidden; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }
  a{ color:inherit; }
  button{ font:inherit; color:inherit; }
  ::selection{ background:var(--hl); color:#000; }
  .anton{ font-family:Anton, Impact, sans-serif; font-weight:400; }

  /* ---------- backdrop: drifting diagonal hatch */
  .bg{ position:fixed; inset:0; z-index:0; pointer-events:none;
    background:repeating-linear-gradient(115deg, rgba(255,255,255,.028) 0 2px, transparent 2px 14px);
    background-size:200% 200%; animation:hatch 30s linear infinite; }
  .bg::after{ content:''; position:absolute; inset:0;
    background:radial-gradient(60% 70% at 75% 30%, color-mix(in srgb, var(--c) 18%, transparent), transparent 70%);
    transition:background .6s; }
  @keyframes hatch{ to{ background-position:-280px 0; } }

  /* ---------- top bar */
  .top{ position:fixed; top:0; left:0; right:0; z-index:30; display:flex; align-items:center; justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 22px) var(--pad) 0; pointer-events:none; }
  .top > *{ pointer-events:auto; }
  .logo{ font-family:Anton, sans-serif; font-style:italic; font-size:28px; letter-spacing:.04em; text-decoration:none; text-shadow:0 2px 12px rgba(0,0,0,.5); }
  .logo b{ color:var(--hl); font-weight:400; }
  .tools{ display:flex; gap:8px; position:relative; }
  .ib{ height:42px; min-width:42px; padding:0 12px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:rgba(14,12,26,.82); border:2px solid var(--line); color:var(--dim); cursor:pointer; transform:skewX(-10deg);
    font-size:12px; font-weight:700; letter-spacing:.12em; backdrop-filter:blur(6px); transition:color .2s, border-color .2s; }
  .ib > *{ transform:skewX(10deg); }
  .ib:hover, .ib[aria-expanded="true"], .ib[aria-pressed="true"]{ color:#fff; border-color:#8a80c0; }
  .ib svg{ width:16px; height:16px; }
  .ib .off{ display:none; }
  .ib[aria-pressed="false"] .on{ display:none; } .ib[aria-pressed="false"] .off{ display:block; }
  .ver-panel{ position:absolute; right:0; top:52px; width:min(320px, calc(100vw - 32px)); background:rgba(14,12,26,.97); border:2px solid var(--line);
    padding:8px; display:none; box-shadow:0 20px 50px rgba(0,0,0,.6); }
  .ver-panel.open{ display:block; animation:drop .25s var(--ease); }
  .ver-panel h5{ font-size:10px; letter-spacing:.2em; color:var(--mute); margin:4px 8px 8px; font-weight:700; }
  .ver-panel button, .ver-panel a{ display:block; width:100%; text-align:left; background:none; border:0; padding:8px; cursor:pointer;
    font-size:13px; color:var(--dim); text-decoration:none; }
  .ver-panel button:hover, .ver-panel a:hover{ background:rgba(255,255,255,.06); color:#fff; }
  .ver-panel button.cur{ color:var(--hl); }
  .ver-panel button b{ color:#fff; margin-right:6px; }
  .ver-panel a{ border-top:1px solid var(--line); margin-top:4px; padding-top:10px; font-size:11px; letter-spacing:.16em; text-align:center; }
  @keyframes drop{ from{ opacity:0; transform:translateY(-8px); } }

  /* ---------- hero (the selected game) */
  .hero{ position:fixed; left:0; top:0; bottom:0; width:var(--heroW); z-index:10; background:var(--c); transition:background-color .45s;
    clip-path:polygon(0 0, 100% 0, 80% 100%, 0 100%); overflow:hidden; }
  .media{ position:absolute; inset:0; clip-path:polygon(0 0, 97% 0, 77.6% 100%, 0 100%); background:var(--bg); }
  .media img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; animation:kb 18s ease-in-out infinite alternate; transform-origin:30% 40%; }
  @keyframes kb{ from{ transform:scale(1.04) translate(0,0); } to{ transform:scale(1.16) translate(-2.5%, -1.5%); } }
  .shade{ position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(0deg, rgba(14,12,26,.97) 0%, rgba(14,12,26,.62) 42%, rgba(14,12,26,.08) 75%),
               linear-gradient(90deg, rgba(14,12,26,.55), transparent 60%); }
  .scan{ position:absolute; inset:0; pointer-events:none; opacity:.35; mix-blend-mode:overlay;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 1px, transparent 1px 3px); }
  .slash{ position:absolute; top:-10%; bottom:-10%; left:0; width:38%; background:var(--c); transform:translateX(-160%) skewX(-20deg);
    mix-blend-mode:screen; opacity:.85; pointer-events:none; }

  .info{ position:absolute; left:var(--pad); bottom:clamp(28px, 6vh, 64px); width:calc(var(--heroW) * .78 - var(--pad) * 1.5);
    display:flex; flex-direction:column; gap:clamp(10px, 1.6vh, 18px); }
  .kick{ display:flex; align-items:center; gap:12px; font-size:13px; font-weight:700; letter-spacing:.2em; color:var(--hl); }
  .p1{ font-family:Anton, sans-serif; font-size:20px; letter-spacing:.04em; color:#fff; background:var(--p1); padding:1px 12px; transform:skewX(-12deg); }
  .name{ font-family:Anton, sans-serif; font-weight:400; font-style:italic; text-transform:uppercase; line-height:.86; letter-spacing:-.005em;
    font-size:clamp(56px, 8.4vw, 150px); text-shadow:.045em .045em 0 var(--c); transition:text-shadow .45s; white-space:nowrap; }
  .name .ln{ display:block; }
  .name .l{ display:inline-block; animation:letIn .55s calc(var(--base, 0ms) + var(--k) * 26ms) both var(--pop); }
  @keyframes letIn{ from{ opacity:0; transform:translate3d(0, .5em, 0) skewX(-16deg) scale(.8); filter:blur(6px); } }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; padding:6px 12px; border:2px solid rgba(255,255,255,.35);
    transform:skewX(-12deg); animation:rise .45s calc(var(--base, 0ms) + 160ms + var(--k) * 50ms) both var(--ease); }
  .chip:first-child{ background:var(--c); border-color:var(--c); }
  .blurb{ font-size:clamp(14px, 1.15vw, 17px); line-height:1.5; color:#ddd9ee; max-width:34em; animation:riseP .5s calc(var(--base, 0ms) + 240ms) both var(--ease); }
  @keyframes rise{ from{ opacity:0; transform:translateY(14px) skewX(-12deg); } }
  @keyframes riseP{ from{ opacity:0; transform:translateY(14px); } }
  .act{ display:flex; gap:12px; align-items:center; margin-top:4px; }
  .play{ display:inline-flex; align-items:center; gap:14px; height:60px; padding:0 36px; background:var(--hl); color:#0e0c1a; text-decoration:none;
    font-family:Anton, sans-serif; font-size:26px; letter-spacing:.06em; transform:skewX(-12deg); box-shadow:6px 6px 0 var(--p1);
    transition:transform .15s, box-shadow .15s; }
  .play > *{ transform:skewX(12deg); }
  .play svg{ width:18px; height:18px; }
  .play:hover{ transform:skewX(-12deg) translate(-2px,-2px); box-shadow:9px 9px 0 var(--p1); }
  .play:active{ transform:skewX(-12deg) translate(3px,3px); box-shadow:2px 2px 0 var(--p1); }
  .ext{ width:52px; height:52px; display:inline-flex; align-items:center; justify-content:center; border:2px solid rgba(255,255,255,.35); transform:skewX(-12deg); color:#fff; }
  .ext svg{ width:18px; height:18px; transform:skewX(12deg); }
  .ext:hover{ border-color:#fff; }

  /* ---------- select side */
  .select{ position:relative; z-index:5; margin-left:calc(var(--heroW) + 2vw); padding:clamp(96px, 13vh, 130px) var(--pad) 48px 0;
    min-height:100vh; display:flex; flex-direction:column; gap:18px; max-width:1100px; }
  .shead{ display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }
  .stitle{ font-family:Anton, sans-serif; font-style:italic; font-size:clamp(34px, 3.6vw, 56px); line-height:1; letter-spacing:.01em; }
  .stitle span{ display:inline-block; }
  .search{ display:flex; align-items:center; gap:8px; height:44px; width:min(240px, 100%); padding:0 14px; background:rgba(14,12,26,.85);
    border:2px solid var(--line); transform:skewX(-10deg); color:var(--dim); transition:border-color .2s; }
  .search:focus-within{ border-color:var(--hl); }
  .search > *{ transform:skewX(10deg); }
  .search svg{ width:15px; height:15px; flex:none; }
  .search input{ flex:1; min-width:0; border:0; outline:none; background:none; font:inherit; font-size:14px; color:#fff; }
  .search kbd{ font:inherit; font-size:11px; border:1px solid var(--line); padding:0 6px; color:var(--mute); }
  .filters{ display:flex; flex-wrap:wrap; gap:6px; }
  .filters button{ padding:8px 14px; border:2px solid var(--line); background:none; color:#c9c3e6; cursor:pointer; transform:skewX(-12deg);
    font-size:12px; font-weight:700; letter-spacing:.14em; transition:background .2s, color .2s, border-color .2s; }
  .filters button > span{ display:inline-block; transform:skewX(12deg); }
  .filters button:hover{ border-color:#8a80c0; color:#fff; }
  .filters button[aria-pressed="true"]{ background:#fff; border-color:#fff; color:#0e0c1a; }
  .filters small{ font-size:10px; opacity:.6; margin-left:4px; }

  .grid{ position:relative; display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:clamp(8px, .9vw, 14px); padding:6px 6px 6px 14px; }
  .tile{ position:relative; display:block; aspect-ratio:4 / 3; transform:skewX(-8deg); text-decoration:none; color:#fff; border:0; padding:0;
    background:none; cursor:pointer; outline:none; transition:opacity .35s, transform .35s var(--ease), filter .35s; }
  .tile-in{ position:absolute; inset:0; overflow:hidden; background:var(--panel); }
  .tile img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:skewX(8deg) scale(1.18);
    filter:saturate(.7) brightness(.78); transition:filter .3s, transform .5s var(--ease); }
  .strip{ position:absolute; inset:0; opacity:0; background-repeat:no-repeat; background-size:calc(var(--n, 4) * 100%) 100%; transform:skewX(8deg) scale(1.18); }
  .tile .fade{ position:absolute; inset:0; background:linear-gradient(0deg, rgba(14,12,26,.92), rgba(14,12,26,0) 62%); }
  .tile .bar{ position:absolute; left:0; right:0; top:0; height:4px; background:var(--c); }
  .tile .sc{ position:absolute; left:9px; bottom:6px; font-family:Anton, sans-serif; font-size:clamp(13px, 1.25vw, 19px); letter-spacing:.04em; white-space:nowrap; }
  .tile:hover img, .tile.sel img{ filter:none; transform:skewX(8deg) scale(1.08); }
  .tile.sel.has-anim .strip{ opacity:1; animation:strip var(--dur, 1.3s) steps(var(--n, 4)) infinite; }
  @keyframes strip{ from{ background-position:0 0; } to{ background-position:var(--end, 133.333%) 0; } }
  .tile.sel .tile-in::after{ content:''; position:absolute; top:0; bottom:0; width:40%; left:-60%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); animation:sweep 2.6s 0.4s ease-in-out infinite; }
  @keyframes sweep{ 0%{ left:-60%; } 40%, 100%{ left:130%; } }
  .tile.off{ opacity:.14; filter:grayscale(1); transform:skewX(-8deg) scale(.9); pointer-events:none; }
  .tile.rnd .tile-in{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; background:transparent; border:2px dashed #5b5385; color:var(--hl); }
  .tile.rnd b{ font-family:Anton, sans-serif; font-size:clamp(28px, 2.8vw, 44px); line-height:1; font-weight:400; transform:skewX(8deg); animation:wobble 2.4s ease-in-out infinite; }
  .tile.rnd small{ font-size:10px; font-weight:700; letter-spacing:.18em; transform:skewX(8deg); }
  .tile.rnd:hover .tile-in, .tile.rnd:focus-visible .tile-in{ border-color:var(--hl); background:rgba(255,212,0,.08); }
  .tile.rnd:hover b{ animation-duration:.4s; }
  @keyframes wobble{ 0%, 100%{ transform:skewX(8deg) rotate(0); } 25%{ transform:skewX(8deg) rotate(-8deg); } 75%{ transform:skewX(8deg) rotate(8deg); } }

  .cursor{ position:absolute; left:0; top:0; z-index:3; pointer-events:none; transform:translate(var(--x, 0), var(--y, 0)) skewX(-8deg);
    width:var(--w, 0); height:var(--h, 0); transition:transform .26s var(--pop), width .26s, height .26s, opacity .2s; }
  .cursor::before{ content:''; position:absolute; inset:-7px; border:4px solid var(--hl); box-shadow:0 0 0 0 rgba(255,212,0,.55), inset 0 0 0 1px rgba(0,0,0,.3);
    animation:pulse 1.4s ease-out infinite; }
  .cursor span{ position:absolute; right:-7px; top:-7px; font-family:Anton, sans-serif; font-size:14px; padding:1px 8px; background:var(--p1); color:#fff;
    animation:bob 1.4s ease-in-out infinite; }
  .cursor.hide{ opacity:0; }
  .cursor.land::before{ animation:land .5s var(--pop), pulse 1.4s .5s ease-out infinite; }
  @keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(255,212,0,.55); } 100%{ box-shadow:0 0 0 14px rgba(255,212,0,0); } }
  @keyframes bob{ 0%, 100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }
  @keyframes land{ 0%{ inset:-26px; opacity:0; } 100%{ inset:-7px; opacity:1; } }

  .hints{ display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:12px; font-weight:700; letter-spacing:.16em; color:var(--mute); padding-top:4px; }
  .hints kbd{ font:inherit; color:var(--dim); }
  .t-touch{ display:none; }

  /* ---------- launch wipe */
  .wipe{ position:fixed; inset:0; z-index:100; background:var(--c); pointer-events:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    clip-path:polygon(0 0, 0 0, -30% 100%, -30% 100%); color:#0e0c1a; }
  .wipe b{ font-family:Anton, sans-serif; font-weight:400; font-style:italic; font-size:clamp(64px, 14vw, 220px); line-height:.9; opacity:0; }
  .wipe small{ font-size:13px; font-weight:700; letter-spacing:.3em; opacity:0; }
  .wipe.on{ pointer-events:auto; animation:wipeIn .42s cubic-bezier(.7,0,.3,1) forwards; }
  .wipe.on b{ animation:slam .4s .18s var(--pop) forwards; }
  .wipe.on small{ animation:rise .3s .3s forwards; }
  @keyframes wipeIn{ to{ clip-path:polygon(0 0, 130% 0, 100% 100%, -30% 100%); } }
  @keyframes slam{ from{ opacity:0; transform:scale(1.6) skewX(-12deg); } to{ opacity:1; transform:scale(1) skewX(-12deg); } }

  /* ---------- intro (page open) */
  .intro .hero{ animation:heroIn .7s cubic-bezier(.75,0,.2,1) both; }
  .intro .media{ animation:mediaIn .8s .2s cubic-bezier(.75,0,.2,1) both; }
  .intro .top{ animation:fadeIn .5s .6s both; }
  .intro .stitle span{ animation:wordIn .55s calc(.35s + var(--k) * 90ms) both var(--pop); }
  .intro .filters, .intro .search, .intro .hints{ animation:fadeIn .5s .8s both; }
  .intro .tile-in{ animation:tileIn .55s calc(.35s + var(--d) * 45ms) both var(--pop); }
  .intro .cursor{ animation:fadeIn .3s 1.15s both; }
  @keyframes heroIn{ from{ clip-path:polygon(0 0, 0 0, -20% 100%, 0 100%); } }
  @keyframes mediaIn{ from{ clip-path:polygon(0 0, 0 0, -20% 100%, 0 100%); } }
  @keyframes fadeIn{ from{ opacity:0; } }
  @keyframes wordIn{ from{ opacity:0; transform:translateX(40px) skewX(-20deg); } }
  @keyframes tileIn{ from{ opacity:0; transform:translate(50px, 10px) scale(.6); } }

  /* ---------- tablet */
  @media (max-width:1180px){ :root{ --heroW:48vw; } .grid{ grid-template-columns:repeat(4, minmax(0, 1fr)); } }

  /* ---------- phone / narrow: hero pinned on top, grid scrolls under it */
  @media (max-width:820px){
    :root{ --pad:16px; }
    .top{ padding-top:calc(env(safe-area-inset-top) + 14px); }
    .logo{ font-size:22px; }
    .ib{ height:38px; min-width:38px; padding:0 10px; }
    .hero{ right:0; bottom:auto; width:auto; height:var(--hh, 54svh); clip-path:polygon(0 0, 100% 0, 100% 86%, 0 100%); }
    .media{ clip-path:polygon(0 0, 100% 0, 100% 83%, 0 97%); }
    .info{ left:var(--pad); right:var(--pad); width:auto; bottom:calc(14% + 8px); gap:8px; }
    .name{ font-size:clamp(40px, 13vw, 76px); }
    .kick{ font-size:11px; }
    .p1{ font-size:16px; }
    .chip{ font-size:10px; padding:4px 9px; }
    .blurb{ font-size:13.5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; transition:opacity .2s; }
    .hero.compact .blurb, .hero.compact .chips{ display:none; }
    .play{ height:48px; padding:0 24px; font-size:20px; box-shadow:4px 4px 0 var(--p1); }
    .ext{ width:44px; height:44px; }
    .select{ margin-left:0; padding:calc(54svh + 10px) var(--pad) calc(env(safe-area-inset-bottom) + 32px); gap:14px; }
    .stitle{ font-size:30px; }
    .search{ width:100%; order:3; }
    .grid{ grid-template-columns:repeat(4, minmax(0, 1fr)); gap:9px; padding-left:10px; }
    .tile .sc{ font-size:13px; left:7px; bottom:4px; }
    .t-key{ display:none; } .t-touch{ display:inline; }
    .intro .hero{ animation-name:heroInM; }
    .intro .media{ animation-name:heroInM; }
    @keyframes heroInM{ from{ clip-path:polygon(0 0, 0 0, 0 100%, 0 100%); } }
  }
  @media (max-width:380px){ .grid{ grid-template-columns:repeat(3, minmax(0, 1fr)); } }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration:.01ms !important; animation-delay:0s !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body class="intro" data-no-switcher data-no-gamelist>
<div class="bg" aria-hidden="true"></div>

<header class="top">
  <a class="logo" href="./">JOJKOS <b>GAMES</b></a>
  <div class="tools">
    <button class="ib" id="sfx" type="button" aria-pressed="false" aria-label="Sound effects">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>
    <button class="ib" id="ver" type="button" aria-expanded="false" aria-haspopup="true"><span>VER ▾</span></button>
    <div class="ver-panel" id="verPanel" role="menu"></div>
  </div>
</header>

<section class="hero" id="hero" aria-label="Selected game">
  <div class="media" id="media"></div>
  <div class="scan" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>
  <div class="slash" id="slash" aria-hidden="true"></div>
  <div class="info" id="info">
    <div class="kick"><span class="p1">P1</span><span id="idx"></span></div>
    <h1 class="name" id="name"></h1>
    <div class="chips" id="chips"></div>
    <p class="blurb" id="blurb"></p>
    <div class="act">
      <a class="play" id="play" href="#"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg><span>PLAY</span></a>
      <a class="ext" id="ext" href="#" target="_blank" rel="noopener" aria-label="Open in a new tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v6H4V6h6"/></svg></a>
    </div>
  </div>
</section>

<main class="select">
  <div class="shead">
    <h2 class="stitle"><span style="--k:0">CHOOSE</span> <span style="--k:1">YOUR</span> <span style="--k:2">FIGHTER</span></h2>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search" aria-label="Search projects" autocomplete="off" spellcheck="false">
      <kbd class="t-key">/</kbd>
    </label>
  </div>
  <nav class="filters" id="filters" aria-label="Filter"></nav>
  <div class="grid" id="grid">
    <div class="cursor hide" id="cursor" aria-hidden="true"><span>P1</span></div>
  </div>
  <div class="hints">
    <span class="t-key"><kbd>← ↑ → ↓</kbd> SELECT · <kbd>ENTER</kbd> PLAY · <kbd>R</kbd> RANDOM</span>
    <span class="t-touch">TAP TO PICK · TAP AGAIN TO PLAY</span>
